<style>

<script>
const POOL=[{"v": "p", "w": 1, "q": "Els reageert op een aanbod van €100 met 'akkoord voor €90'. Wat is er ontstaan?", "o": ["Een overeenkomst voor €90", "Een overeenkomst voor €100", "Geen overeenkomst, maar een nieuw aanbod van Els"], "a": 2, "e": "6:225 lid 1: afwijkende aanvaarding geldt als nieuw aanbod."}, {"v": "p", "w": 1, "q": "Jan wilde €500 zeggen maar zei €50. De koper kon dat niet weten. Wat is juist?", "o": ["De verklaring bindt op grond van 3:35", "Er is geen overeenkomst omdat de wil ontbreekt", "De overeenkomst is vernietigbaar wegens dwaling zonder meer"], "a": 0, "e": "Het vertrouwensbeginsel beschermt de koper die redelijkerwijs mocht vertrouwen."}, {"v": "p", "w": 1, "q": "Klopt het dat een overeenkomst altijd schriftelijk moet zijn? Onderbouw kritisch.", "o": ["Ja, anders is hij nietig", "Nee, verklaringen zijn in beginsel vormvrij (3:37 lid 1), tenzij de wet een vorm eist", "Alleen boven €500"], "a": 1, "e": "Vormvrijheid is de hoofdregel."}, {"v": "p", "w": 2, "q": "Iemand koopt een huis naast een fabriek en hoort later veel lawaai. Kan hij zich met succes op dwaling beroepen?", "o": ["Ja, hij wist het niet", "Waarschijnlijk niet: het risico kan volgens de omstandigheden voor zijn rekening komen (6:228 lid 2)", "Ja, want het is bedrog"], "a": 1, "e": "Onderzoeksplicht en aard van de situatie spelen mee."}, {"v": "p", "w": 2, "q": "Een minderjarige koopt een scooter zonder toestemming. Is dat een wilsgebrek?", "o": ["Ja, misbruik van omstandigheden", "Nee, dat is een kwestie van handelingsonbekwaamheid (3:32)", "Ja, dwaling"], "a": 1, "e": "Handelingsonbekwaamheid is een aparte grond."}, {"v": "p", "w": 2, "q": "Een contract om voor geld een misdrijf te plegen is…", "o": ["vernietigbaar", "nietig wegens strijd met goede zeden of openbare orde (3:40 lid 1)", "geldig"], "a": 1, "e": "3:40 lid 1."}, {"v": "p", "w": 3, "q": "Partijen kunnen niet uit de tekst afleiden wat een bepaling betekent. Welk uitgangspunt geldt volgens Haviltex?", "o": ["Alleen de taalkundige betekenis", "De redelijkerwijs te verwachten zin van partijen in de omstandigheden", "De wil van de sterkste partij"], "a": 1, "e": "Haviltex."}, {"v": "p", "w": 3, "q": "Een verkoper levert een dag te laat, zonder ingebrekestelling. Kan de koper zonder meer ontbinden?", "o": ["Ja, elke tekortkoming volstaat", "Nee: meestal is verzuim nodig en de tekortkoming mag niet te gering zijn (6:265, 6:82)", "Ja, maar alleen bij consumenten"], "a": 1, "e": "Twee drempels: verzuim en niet te gering."}, {"v": "p", "w": 3, "q": "Een prijsstijging is 'onvoorzien'. Slaagt de partij bijna altijd op 6:258?", "o": ["Ja, dat is de kern van de bepaling", "Nee, de rechter is terughoudend en de omstandigheid mag niet voor eigen rekening komen", "Ja, bij elke overeenkomst"], "a": 1, "e": "Campina/Van Jole laat de terughoudendheid zien."}, {"v": "p", "w": 4, "q": "Een koper had de schade eenvoudig kunnen beperken maar deed niets. Welk artikel is relevant?", "o": ["6:98", "6:101", "6:119"], "a": 1, "e": "Eigen schuld."}, {"v": "p", "w": 4, "q": "De schade is voorzienbaar, maar zeer ver verwijderd van de tekortkoming. Waar toets je dat?", "o": ["6:98, redelijke toerekening", "6:101", "6:74 lid 1 alleen"], "a": 0, "e": "6:98 stuurt de begrenzing."}, {"v": "p", "w": 4, "q": "Een verkoper is gedeeltelijk schuldig omdat de koper zelf ook slordig was. Wat gebeurt er met de vergoeding?", "o": ["Ze vervalt helemaal", "Ze wordt verminderd volgens 6:101", "Ze blijft gelijk"], "a": 1, "e": "Eigen schuld leidt tot verdeling."}, {"v": "p", "w": 5, "q": "Een bezoeker valt in een kelderluik dat openstond. Wat weeg je af volgens Kelderluik?", "o": ["Alleen of de wet is geschonden", "Kans op schade, ernst, voorzorgskosten en aard van de gedraging", "Alleen de ernst van het letsel"], "a": 1, "e": "Kelderluikafweging."}, {"v": "p", "w": 5, "q": "Een norm is geschonden, maar strekte niet tot bescherming tegen deze schade. Wat is het gevolg?", "o": ["Toch aansprakelijk", "Geen aansprakelijkhe "Bakker Sam runt een ambachtelijke bakkerij in Utrecht. Op 1 mei bestelt hij bij groothandel Molenaars BV 500 kg speciale roggebloem voor een grote weekendorder van een cateraar, goed voor €2.400 omzet. Molenaars bevestigt schriftelijk: levering uiterlijk 10 mei, betaling bij levering. In de overeenkomst staat uitdrukkelijk dat de leveringstermijn fataal is. Op 10 mei komt er niets en op 12 mei is er nog steeds niets geleverd. Molenaars belt en biedt levering op 15 mei aan. Sam is de cateringorder inmiddels kwijt en heeft elders bloem gekocht tegen een hogere prijs. Hij wil schadevergoeding, overweegt ontbinding en vraagt zich af of hij eerst een brief had moeten sturen. Molenaars zegt: \"Mijn chauffeur is ziek geworden, daar kan ik niets aan doen.\"",
"Ben Jacobs ruimt het huis van zijn overleden oom op en vindt op zolder een schilderij zonder handtekening. Hij zet het op Marktplaats. Lisa, kunsthistoricus bij een veilinghuis, komt kijken. Ben zegt: \"Waarschijnlijk een kopie, €200 is genoeg.\" Lisa herkent binnen een minuut de hand van een bekende meester, maar zegt niets over haar vermoeden en betaalt €200. Later laat zij het schilderij taxeren: €20.000. Ben hoort dit van een buurman en wil van de koop af. Lisa zegt dat Ben zelf \"kopie\" zei en dat een verkoper een onderzoeksplicht heeft.",
"Mo woont in Groningen en heeft een dure elektrische fiets. Zijn buurvrouw Yara mag de fiets een week lenen voor een klus. In plaats van terug te brengen adverteert Yara de fiets online als \"mijn eigen fiets\" en verkoopt hem voor €850, een gebruikelijke prijs voor dit model, aan Tim. Tim heeft geen reden om te twijfelen, betaalt contant en neemt de fiets mee. Mo ontdekt dit en eist zijn fiets terug van Tim. Tim zegt dat hij de fiets eerlijk heeft gekocht.",
"In gemeente W. veroorzaken enkele bewoners van het AZC overlast in het winkelcentrum: diefstal, intimidatie en hinder. Burgemeester K. besluit een aantal bewoners, onder wie Y., voor onbepaalde tijd te verbieden zich buiten het AZC te begeven, met uitzondering van één uur per dag voor boodschappen of de huisarts. Hij baseert zich op de Algemene plaatselijke verordening en op art. 172 lid 3 Gemeentewet. Critici stellen dat hij art. 15 lid 1 Grondwet en art. 2 Protocol 4 EVRM schendt. Een advocaat wil de zaak voor de rechter brengen en vraagt of de rechter de wet buiten toepassing mag laten.",
"Restaurant Bel Canto is op vrijdagavond vol. De eigenaar laat het kelderluik achter de bar openstaan om sneller bij de voorraad te komen. Het luik ligt in de looproute naar de toiletten, er staat geen afzetting en er hangt geen waarschuwing. Het is druk en het licht is gedempt. Gast Kim loopt naar de toiletten, ziet het luik niet en valt twee meter naar beneden. Ze breekt haar been, kan zes weken niet werken en moet een reis annuleren. De eigenaar zegt: \"Het duurde maar even, en iedereen weet dat je in een restaurant moet opletten.\"",
"Piet is projectontwikkelaar en wil het huis van Anna, een oudere weduwe, kopen voor een nieuwbouwproject. Anna weigert. Op een avond staat Piet voor de deur en zegt: \"Verkoop mij je huis voor €50.000, anders zorg ik dat je zoon iets overkomt.\" Anna heeft één zoon die in dezelfde stad woont. Uit angst tekent ze de volgende dag de koopovereenkomst. Later vertelt ze het aan haar zoon, die aangifte adviseert. Piet zegt dat Anna vrijwillig tekende en dat het huis toch niet meer waard was.",
"Els koopt een oude woning en laat de badkamer verbouwen door aannemer Jan. In de offerte staat: \"Afwerking naar goed vakmanschap.\" Tijdens een gesprek voor het tekenen zegt Els dat ze iets luxueus wil en toont ze foto's van een marmeren badkamer. Jan antwoordt: \"Komt goed.\" De prijs is €18.000, een bedrag waarvoor marmer volgens Jan niet haalbaar is. Jan legt standaard keramische tegels. Els weigert de laatste betaling omdat het geen goed vakmanschap is. Jan zegt dat de offerte duidelijk is.",
"Karin en Bas sluiten een schriftelijke koopovereenkomst (onderhandse akte) over Karins huis voor €350.000. De levering bij de notaris is gepland voor over twee maanden. Bas maakt het bedrag over en krijgt alvast de sleutels. Hij begint aan de verbouwing. Karin komt terug op de afspraak: \"Er is nog geen akte bij de notaris gepasseerd, dus het huis is nog van mij.\" Bas zegt dat hij betaald heeft en de sleutels kreeg, dus dat het huis van hem is.",
"Twee tieners spelen een online rollenspel waarin spelers virtuele zwaarden en harnassen verzamelen die veel tijd en soms echt geld kosten. Tiener A bedreigt tiener B in de echte wereld met een mes en dwingt hem in het spel zijn zeldzame zwaard aan hem over te dragen, waarna B het niet meer kan gebruiken. Het OM vervolgt A voor diefstal met geweld. De verdediging stelt dat een virtueel zwaard geen goed is en dat een strafbaarstelling zonder duidelijke wettelijke basis in strijd is met het legaliteitsbeginsel.",
"Van Dijk wil een dakterras op zijn monumentale woning aan de Kerkstraat. Hij vraagt aan het loket van de gemeente aan de heer De Vries of dat mag. De Vries zegt: \"Dit soort kleine dakterrassen keuren we eigenlijk altijd goed, u kunt er rustig van uitgaan.\" Van Dijk stuurt een bevestigingsmail; De Vries antwoordt vanaf het algemene e-mailadres dat hij geen problemen verwacht, met onderaan een disclaimer dat aan de mail geen rechten kunnen worden ontleend. Van Dijk sluit een contract met een aannemer en betaalt €12.000 aan. Daarna weigert het college de vergunning omdat het pand in een beschermd stadsgezicht ligt en omwonenden bezwaar maken. Van Dijk beroept zich op het vertrouwensbeginsel."];
const INFO=[
"Bij wanprestatie werk je vaste stappen af: (1) tekortkoming: een opeisbare verbintenis is niet nagekomen; (2) verzuim: in de regel na ingebrekestelling met een redelijke termijn (6:82), maar niet nodig in de gevallen van 6:83, zoals een fatale termijn; (3) toerekenbaarheid (6:75: schuld, wet, rechtshandeling of verkeersopvatting; 6:76 bij hulppersonen); (4) remedies: nakoming (3:296), opschorting (6:262), ontbinding (6:265) en schadevergoeding (6:74). Ontbinding vraagt een niet te geringe tekortkoming, kan buitengerechtelijk (6:267) en leidt tot ongedaanmaking (6:271).",
"Dwaling (6:228 lid 1) vraagt: een onjuiste voorstelling van zaken, causaal verband (zonder dwaling niet gesloten) en een van de gronden a (onjuiste inlichting van de wederpartij), b (wederpartij had moeten inlichten) of c (gemeenschappelijke dwaling), waarbij de wederpartij het belang moet kunnen kennen. Bij verkopersdwaling weeg je de mededelingsplicht van de deskundige koper tegen de onderzoeksplicht van de verkoper. Lid 2: geen dwaling bij toekomstige omstandigheden of risico voor eigen rekening. Gevolg: vernietigbaar of wijziging (6:230).",
"Overdracht van een roerende zaak (3:84 lid 1): geldige titel, beschikkingsbevoegdheid en levering (3:90, bezitsverschaffing). Is de vervreemder onbevoegd, dan beschermt 3:86 de verkrijger onder bezwarende titel en te goeder trouw (3:11: weet of behoort te weten). Uitzondering in lid 3: aan de rechthebbende ontstolen of verloren zaken, behalve geld en toonderpapier. Uitlenen is geen ontstelen: de eigenaar heeft de zaak zelf uit handen gegeven, dus de verkrijger is beschermd.",
"Toetsingsverbod: art. 120 Gw verbiedt de rechter formele wetten aan de Grondwet te toetsen. Art. 94 Gw: wettelijke voorschriften gelden niet als toepassing in strijd is met eenieder verbindende verdragsbepalingen. Een APV is geen formele wet en kan wel aan de Grondwet worden getoetst. Let op het verschil tussen wetten in formele zin en lagere regelgeving.",
"Onrechtmatige daad (6:162): onrechtmatigheid (inbreuk op recht, wettelijke plicht of ongeschreven zorgvuldigheid), toerekenbaarheid (schuld, wet, verkeersopvatting), schade, causaal verband (6:98) en relativiteit (6:163). Kelderluik: weeg de kans op schade, de ernst, de bezwaarlijkheid van maatregelen en de aard van de gedraging. Schadeposten: vermogensschade (6:96), ander nadeel zoals smartengeld (6:106) en eigen schuld (6:101).",
"Wilsgebreken maken de rechtshandeling vernietigbaar (3:44 lid 1). Bedreiging (lid 2): onrechtmatige dreiging met nadeel, een redelijk mens kan beïnvloed zijn, causaal verband. Bedrog (lid 3): kunstgreep, dubbel opzet. Misbruik van omstandigheden (lid 4): bijzondere omstandigheid, kenbaar, bevorderen. Vernietigbaar betekent geldig tot vernietiging. Nietig is anders: nooit geldig geweest (3:40).",
"Uitleg van overeenkomsten (Haviltex): niet alleen taal, maar de zin die partijen over en weer redelijkerwijs aan de bepalingen mochten toekennen en wat zij redelijkerwijs van elkaar mochten verwachten. Relevant zijn context, uitlatingen voor het sluiten, prijs, deskundigheid en de kring waartoe partijen behoren. Aanvulling en beperking via 6:248 lid 1 en 2.",
"Overdracht van registergoederen: geldige titel, beschikkingsbevoegdheid en levering door een notariële akte plus inschrijving in de registers (3:89). Sleuteloverdracht is geen levering van een woning. De koper heeft een vordering uit de koop (levering), maar is nog geen eigenaar.",
"Legaliteitsbeginsel (art. 1 Sr): geen straf zonder voorafgaande wettelijke bepaling, met vier vormen: lex scripta, lex certa, lex stricta en lex praevia. Interpretatiemethoden: grammaticaal, wetshistorisch, systematisch, teleologisch en rechtsvergelijkend. Elektriciteitsarrest: strikte uitleg (elektriciteit is geen goed); Runescape: ruimere, maatschappelijk gedreven uitleg, met kritiek.",
"Vertrouwensbeginsel: een toezegging of gedraging van het bestuur die gerechtvaardigd vertrouwen wekt. Let op: is de toezegging door een bevoegd orgaan gedaan (of mocht de burger uitgaan van bevoegdheid), is zij voldoende concreet en zijn er voorbehouden? Andere beginselen: zorgvuldigheid, motivering, evenredigheid (3:4 lid 2 Awb). Rechtsgang: bezwaar, beroep bij de rechtbank en hoger beroep bij de ABRvS; belanghebbende (1:2 Awb)."];

{v:'Privaatrecht',t:'Het verhuisbedrijf',tx:'Studente Noor huurt op 1 september bij Verhuisbedrijf Snel BV een bus met twee verhuizers om op zaterdag 14 september haar inboedel van Rotterdam naar Utrecht te brengen. Op de dag zelf komt het bedrijf niet opdagen. Noor belt om 9 uur en Snel BV belooft "binnen twee uur" te komen, maar dat gebeurt niet. Noor moet daarna zelf een dure bus huren voor €450 en verliest een dag onbetaald werk (€120). De sleutel van haar oude huis moest die dag om 17.00 uur zijn ingeleverd; omdat zij te laat is, betaalt zij €200 boete aan de verhuurder. Noor had vooraf kunnen weten dat bij de verhuurder een boete gold, en had haar vader kunnen vragen alvast de sleutels in te leveren, maar deed dat niet.',st:[
{tag:'Leerstuk herkennen',q:'Waar begin je?',o:[O('Onrechtmatige daad (6:162), want Noor lijdt schade',0,'Er is een overeenkomst en Snel BV is die niet nagekomen. Contractuele schade beoordeel je via de tekortkoming (6:74).'),O('Tekortkoming in de nakoming, met schadevergoeding als remedie (6:74)',1,'Juist: overeenkomst, verbintenis (verhuizen op de afgesproken dag) die niet is nagekomen.'),O('Ontbinding wegens onvoorziene omstandigheden (6:258)',0,'Er is geen verandering van omstandigheden; Snel BV komt gewoon niet.')]},
{tag:'Vereisten/volgorde',q:'Wat is de juiste volgorde van toetsing?',o:[O('Schade, dan verzuim, dan tekortkoming',0,'Je begint niet bij de schade. Eerst moet er een tekortkoming zijn.'),O('Tekortkoming, verzuim, toerekenbaarheid, schade en causaal verband',1,'Juist.'),O('Toerekenbaarheid, dan schade, dan tekortkoming',0,'Toerekenbaarheid komt pas na de tekortkoming en het verzuim.')]},
{tag:'Uitzondering',q:'Is een ingebrekestelling nodig geweest? Snel BV zegt telefonisch toe "binnen twee uur" te komen.',o:[O('Ja, altijd schriftelijk, anders geen verzuim',0,'6:82 is de hoofdregel, maar er zijn uitzonderingen in 6:83. Kijk naar de feiten.'),O('Mogelijk niet: een afgesproken vaste dag kan leiden tot verzuim zonder ingebrekestelling (6:83 sub a); zo niet, dan is het telefoontje een informele ingebrekestelling met een korte termijn',1,'Juist: een afspraak voor 14 september kan een fatale termijn zijn; anders kan het telefoontje met een korte termijn als ingebrekestelling gelden. Beoordeel dit in het tentamen expliciet.'),O('Nee, verzuim is voor schadevergoeding niet nodig',0,'Verzuim is in de regel wel nodig voor schadevergoeding wegens vertraging.')]},
{tag:'Toepassen',q:'Welke schadeposten kunnen worden toegerekend (6:98)?',o:[O('Alle drie zonder meer',0,'Er is ook eigen schuld; de boete kan (deels) aan Noor zelf worden toegerekend.'),O('De buskosten en het gemiste loon zijn goed toe te rekenen; de boete vergt een toets aan 6:98 en 6:101',1,'Juist: de gemaakte kosten en gederfde inkomsten zijn redelijk toe te rekenen; bij de boete weegt mee dat Noor de schade kon beperken.'),O('Alleen het gemiste loon',0,'De extra buskosten zijn juist een klassieke schadepost.')]},
{tag:'Conclusie',q:'Wat betekent de eigen schuld (6:101) voor de vergoeding?',o:[O('Die vervalt volledig',0,'Eigen schuld leidt tot vermindering, niet tot verval.'),O('Voor de boete wordt de vergoeding verminderd naar billijkheid, omdat Noor de sleutels had kunnen laten inleveren',1,'Juist: de rechter verdeelt de schade naar de mate waarin beide partijen bijdroegen.'),O('Er is geen eigen schuld bij wanprestatie',0,'6:101 kan ook bij een contractuele tekortkoming gelden.')]}]},
{v:'Privaatrecht',t:'De dubbel betaalde rekening',tx:'Marco krijgt van zijn energiebedrijf een teruggaaf van €800. Twee weken later maakt hetzelfde bedrijf per ongeluk nogmaals €800 over. Marco ziet dat op zijn rekening, denkt dat het een extra bonus is en besteedt het geld aan een reis. Na zes weken merkt het energiebedrijf de fout en eist het bedrag terug. Marco zegt: "Ik ben te goeder trouw, het geld is al uitgegeven."',st:[

{tag:'Vereisten/volgorde',q:'Wat is het eerste wat je vaststelt?',o:[O('Dat de betaling zonder rechtsgrond was',1,'Juist: er was geen verplichting tot de tweede betaling.'),O('Dat Marco te kwader trouw was',0,'Dat speelt pas later, bij de omvang van de terugbetaling.'),O('Dat het bedrijf een schuld had',0,'Er was juist geen schuld voor de tweede betaling.')]},
{tag:'Toepassen',q:'Maakt de goede trouw van Marco het verschil?',o:[O('Ja, dan hoeft hij niets terug te betalen',0,'Goede trouw is niet zonder meer voldoende; je moet de regels over ongedaanmaking toetsen.'),O('Goede trouw kan de omvang van de terugbetaling beïnvloeden, maar de terugvordering zelf blijft bestaan',1,'Juist: controleer in de wet hoe goede trouw en verrijking meewegen (6:203 e.v.).'),O('Nee, goede trouw speelt nooit een rol',0,'Goede trouw kan wel een rol spelen bij de omvang van de verplichting.')]},
{tag:'Conclusie',q:'Wat concludeer je?',o:[O('Het energiebedrijf kan het bedrag terugvorderen; controleer welke invloed goede trouw en de uitgave hebben',1,'Juist: de grondslag is er, de omvang volgt uit de verdere regels.'),O('Het energiebedrijf heeft pech gehad',0,'Dat is niet juist: onverschuldigde betaling geeft een vordering.'),O('Het energiebedrijf kan alleen schadevergoeding vorderen',0,'De eerste remedie is ongedaanmaking.')]}]},
{v:'Privaatrecht',t:'De bezorger die door rood reed',tx:'Pizzeria Luigi laat pizza\'s bezorgen door studenten, die per bestelling betaald krijgen. Bezorger Dani heeft haast en fietst door rood. Hij botst tegen fietser Hugo, die zijn pols breekt en twee weken niet kan werken. Luigi zegt: "Dani is zelfstandig, ik ben niet aansprakelijk." Dani is niet verzekerd en heeft geen geld.',st:[
{tag:'Leerstuk herkennen',q:'Welke aansprakelijkheid van Luigi onderzoek je?',o:[O('Kwalitatieve aansprakelijkheid voor een ondergeschikte (6:170)',1,'Juist: Luigi kan aansprakelijk zijn voor de gedraging van Dani, ook zonder eigen fout.'),O('Wanprestatie jegens Hugo',0,'Er is geen overeenkomst tussen Luigi en Hugo.'),O('Aansprakelijkheid voor een dier (6:179)',0,'Er is geen dier bij betrokken.')]},
{tag:'Vereisten/volgorde',q:'Wat toets je eerst?',o:[O('Of Dani zelf onrechtmatig heeft gehandeld',1,'Juist: 6:170 gaat uit van een onrechtmatige gedraging van de ondergeschikte. Door rood rijden is in strijd met een wettelijke plicht.'),O('Of Luigi schuld heeft',0,'Bij kwalitatieve aansprakelijkheid is eigen schuld van Luigi niet vereist.'),O('Hoe hoog de schade is',0,'De schade komt pas aan het einde.')]},
{tag:'Toepassen',q:'Is Dani "ondergeschikte" ondanks dat hij per bestelling wordt betaald?',o:[O('Nee, hij is zelfstandig',0,'Niet de benaming, maar de feitelijke verhouding telt: is er een gezagsverhouding?'),O('Waarschijnlijk wel: hij werkt in dienst van Luigi in de uitoefening van diens bedrijf, met instructies en onder gezag',1,'Juist: kijk naar de gezagsverhouding, niet naar het betalingsmodel. Denk ook aan de vergrote kans op de fout door de opdracht.'),O('Alleen als er een arbeidscontract is',0,'Een schriftelijk contract is niet vereist.')]},
{tag:'Conclusie',q:'Wat is de uitkomst?',o:[O('Luigi is naast Dani aansprakelijk voor de schade van Hugo, zodat Hugo bij hem kan verhalen',1,'Juist: bij haast door de opdracht is de kans op de fout vergroot.'),O('Alleen Dani is aansprakelijk',0,'Dani heeft geen geld en 6:170 beschermt Hugo juist in dit geval.'),O('Niemand is aansprakelijk',0,'Er is een onrechtmatige daad met schade.')]}]},
{v:'Privaatrecht',t:'De brouwerij en de hop',tx:'Brouwerij De Zwaan sluit een jaarcontract met hopleverancier Pieters voor 10.000 kilo hop tegen een vaste prijs. Na een misoogst in het buitenland verdrievoudigt de wereldmarktprijs. Pieters wil het contract ontbinden of de prijs verhogen op grond van onvoorziene omstandigheden. De Zwaan weigert en wijst op de vaste prijs.',st:[
{tag:'Leerstuk herkennen',q:'Welke grondslag roept Pieters in?',o:[O('Onvoorziene omstandigheden (6:258)',1,'Juist: wijziging of ontbinding wegens onvoorziene omstandigheden.'),O('Dwaling (6:228)',0,'De prijsstijging kwam na het sluiten, dus geen onjuiste voorstelling bij het sluiten.'),O('Bedrog (3:44)',0,'Niemand heeft misleid.')]},
{tag:'Vereisten/volgorde',q:'Wat zijn de hoofdlijnen van 6:258?',o:[O('Onvoorziene omstandigheden die ongewijzigde instandhouding naar maatstaven van redelijkheid en billijkheid onaanvaardbaar maken, niet voor rekening van de vorderende partij',1,'Juist.'),O('Elke prijsstijging geeft recht op wijziging',0,'De drempel is hoog, en het risico is vaak voor rekening van de partij.'),O('Alleen de rechter kan de prijs verhogen, altijd',0,'De rechter kan wijzigen of ontbinden, maar alleen onder strikte voorwaarden.')]},
{tag:'Toepassen',q:'Waarom slaagt Pieters waarschijnlijk niet?',o:[O('Prijsschommelingen behoren tot het normale ondernemersrisico en het vaste-prijsbeding deelt het risico bewust toe',1,'Juist: dat is de kern van de terughoudendheid van de rechter (Campina/Van Jole).'),O('Omdat de rechter nooit ingrijpt',0,'De rechter kan ingrijpen, maar doet dat terughoudend.'),O('Omdat De Zwaan een groter bedrijf is',0,'De omvang van het bedrijf is niet doorslaggevend.')]},
{tag:'Conclusie',q:'Wat is je conclusie?',o:[O('Het beroep op 6:258 slaagt waarschijnlijk niet; het vaste-prijsbeding blijft gelden',1,'Juist.'),O('Pieters mag zonder meer ontbinden',0,'Dat mag alleen via de rechter en onder strenge voorwaarden.'),O('De overeenkomst is nietig',0,'Er is geen grond voor nietigheid.')]}]},
{v:'Privaatrecht',t:'De gokhal in de loods',tx:'Verhuurder Bakker verhuurt een loods aan Mehmet voor €3.000 per maand. In de huurovereenkomst staat dat de loods bedoeld is voor "sociale evenementen". Bakker weet dat Mehmet er een illegale gokhal wil openen en verhuurt daarom tegen een hoge huur. Mehmet betaalt drie maanden vooruit (€9.000) en Bakker levert de loods. Kort daarna wordt de gokhal gesloten door de politie. Mehmet wil zijn geld terug.',st:[
{tag:'Leerstuk herkennen',q:'Welke vraag is hier centraal?',o:[O('Geldigheid van de overeenkomst: nietigheid wegens strijd met de goede zeden of openbare orde (3:40 lid 1)',1,'Juist: de strekking van de overeenkomst is ongeoorloofd.'),O('Wilsgebrek: bedrog',0,'Beide partijen wisten wat de bedoeling was; er is geen misleiding.'),O('Onvoorziene omstandigheden',0,'De sluiting was geen onvoorziene omstandigheid; het contract was zelf al ongeoorloofd.')]},
{tag:'Vereisten/volgorde',q:'Wat is het gevolg van nietigheid?',o:[O('De overeenkomst is van meet af aan nietig; er is geen verbintenis',1,'Juist: nietig is nooit geldig geweest.'),O('De overeenkomst is vernietigbaar',0,'Vernietigbaar is een ander gevolg van wilsgebreken.'),O('De overeenkomst is geldig totdat de rechter iets zegt',0,'Dat is vernietigbaarheid.')]},
{tag:'Toepassen',q:'Hoe kan Mehmet zijn geld terugkrijgen?',o:[O('Via nakoming van de huurovereenkomst',0,'Een nietige overeenkomst kan niet worden nagekomen.'),O('Via onverschuldigde betaling (6:203): hij heeft betaald zonder geldige rechtsgrond',1,'Juist: controleer of de ongeoorloofdheid de terugvordering beperkt (zie de regels over ongedaanmaking).'),O('Via schadevergoeding wegens wanprestatie',0,'Er is geen geldige verbintenis waarvan sprake kan zijn van wanprestatie.')]},
{tag:'Conclusie',q:'Wat concludeer je?',o:[O('De huurovereenkomst is nietig; terugbetaling loopt via ongedaanmaking, met een kritische blik op de bijzondere omstandigheden',1,'Juist.'),O('De overeenkomst is geldig omdat beide partijen het wilden',0,'Wilsovereenstemming is geen genoeg als de strekking ongeoorloofd is.'),O('Alleen Bakker kan vernietigen',0,'Bij nietigheid is vernietiging niet nodig.')]}]},
{v:'Rechtswetenschap',t:'Boffers en de verkiezingscampagne',tx:'Tijdens de campagne voor de gemeenteraadsverkiezingen zegt politicus Boffers dat arbeidsmigranten uit Oost-Europa een gevaar vormen voor de "eigen cultuur" en stelt hij voor dat zij hun kiesrecht verliezen. Er wordt aangifte gedaan wegens groepsbelediging en het aanzetten tot haat. Boffers zegt: "In een democratie mag je alles zeggen, dat is vrijheid van meningsuiting."',st:[
{tag:'Leerstuk herkennen',q:'Welke twee opvattingen speelt de discussie?',o:[O('Procedurele en inhoudelijke opvatting van democratie',1,'Juist: dat verklaart de verschillende antwoorden op strafbaarheid.'),O('Rechtspositivisme en rechtsrealisme',0,'Dat zijn rechtstheorieën, geen democratieopvattingen.'),O('Publiek- en privaatrecht',0,'Dat is een indeling van het recht.')]},
{tag:'Artikel',q:'Welke strafbepalingen zijn relevant?',o:[O('Art. 137c en 137d Sr: groepsbelediging en aanzetten tot haat',1,'Juist.'),O('Art. 120 Gw',0,'Dat is het toetsingsverbod.'),O('Art. 6:162 BW',0,'Dat is de onrechtmatige daad.')]},
{tag:'Toepassen',q:'Wat zou een procedurele opvatting van democratie zeggen?',o:[O('Er is veel ruimte voor uitingen, want de meerderheid beslist via de procedure',1,'Juist: minder snel een beperking.'),O('Beperken, want minderheden moeten altijd beschermd worden',0,'Dat is de inhoudelijke opvatting.'),O('Alleen de rechter mag beslissen',0,'Dat volgt niet uit de procedurele opvatting.')]},
{tag:'Conclusie',q:'En vanuit een inhoudelijke opvatting?',o:[O('Beperkingen liggen eerder voor de hand, om minderheden en fundamentele waarden te beschermen',1,'Juist: vergelijk met Refah Partisi (democratie mag zich verdedigen).'),O('Nooit een beperking',0,'Dat is niet de inhoudelijke opvatting.'),O('Alleen bij geweld',0,'Ook uitingen kunnen worden beperkt als ze de rechten van anderen aantasten.')]}]},
{v:'Rechtswetenschap',t:'Klimaat en de rechter',tx:'Stichting Groen Nu vordert dat de Staat de uitstoot van broeikasgassen sneller vermindert. De Staat stelt dat klimaatbeleid een zaak is voor de politiek en dat de rechter zich niet mag mengen in politieke keuzes (trias politica).',st:[

{tag:'Conclusie',q:'Wat is een tegenargument?',o:[O('Democratische legitimiteit: de wetgever, niet de rechter, zou dit soort keuzes moeten maken',1,'Juist: dat is de kern van de kritiek.'),O('Het EVRM is niet geldig',0,'Het EVRM is geldend recht in Nederland.'),O('De rechter is onbevoegd omdat het om geld gaat',0,'Dat is niet de kritiek.')]}]},
{v:'Rechtswetenschap',t:'Wat is hier "recht"?',tx:'Een wet uit een dictatuur verplicht burgers hun buren aan te geven. Na de val van het regime moet de rechter beslissen over een burger die zich aan die wet hield en daardoor iemand in gevaar bracht. Het regime had de wet volgens zijn eigen procedures vastgesteld.',st:[
{tag:'Leerstuk herkennen',q:'Welke vraag stelt deze casus?',o:[O('Wat maakt een regel tot recht? (rechtstheorie)',1,'Juist.'),O('Wie is bevoegd in het bestuursrecht?',0,'Het gaat niet om bevoegdheid van een orgaan.'),O('Welke rechtsbron is het oudst?',0,'Het gaat om de definitie van recht.')]},

{tag:'Conclusie',q:'Welke positie past bij "extreem onrechtvaardige regels zijn geen recht"?',o:[O('Natuurrecht',1,'Juist: vergelijk met Foster in Fuller.'),O('Positivisme',0,'Positivisme zegt juist het tegenovergestelde.'),O('Rechtsrealisme',0,'Realisme kijkt naar de praktijk.')]}]});
const AP=[
['Blaauboer/Berlips','03-03-1905','Wk 6 · introductie goederenrecht','Zeug Geel-113, p. 1-3','Leerstuk: de basis van het goederenrecht. Eigendom is een absoluut recht en werkt tegen iedereen, in tegenstelling tot een verbintenis, die alleen tegen de wederpartij werkt. Kijk in de scan welke rechtsvraag de HR beantwoordt.'],
['Lindenbaum/Cohen','31-01-1919','Wk 5 · onrechtmatige daad','Verkort Verklaard, p. 17-21','Feiten: Cohen kocht een medewerker van concurrent Lindenbaum om, om zo aan bedrijfsinformatie te komen. Rechtsvraag: is dit onrechtmatig terwijl er geen wet of subjectief recht is geschonden? Beslissing: ja. Ook handelen in strijd met de zorgvuldigheid die in het maatschappelijk verkeer betaamt tegenover andermans persoon of goed is onrechtmatig. Belang: basis van 6:162 lid 2, derde categorie.'],
['Burgman/Aviolanda','11-05-1951','Wk 2 · ongeoorloofde overeenkomst','Verkort Verklaard, p. 31-33','Leerstuk: een overeenkomst met een ongeoorloofde inhoud of strekking is nietig (nu 3:40 lid 1). Nietig betekent: nooit geldig geweest, dus geen nakoming en geen schadevergoeding op grond van het contract. Betaald geld terugvragen loopt via ongedaanmaking. Lees de scan voor de concrete feiten.'],
['Baris/Riezenkamp','15-11-1957','Wk 2 · wilsgebreken','Verkort Verklaard, p. 34-36','Leerstuk: wilsgebreken. Dwaling (6:228): onjuiste voorstelling, causaal, en een grond zoals mededelingsplicht of onjuiste inlichting. Bedrog (3:44 lid 3): opzet, kunstgreep, causaal. Misbruik van omstandigheden (3:44 lid 4): bijzondere omstandigheid, kenbaar, bevorderen. Alle leiden tot vernietigbaarheid. Lees de scan om te zien welk gebrek de HR toetst.'],
['Tandartsen','17-01-1958','Wk 5 · onrechtmatige daad','Zeug Geel-113, p. 432-433','Leerstuk: onrechtmatige daad. Toets onrechtmatigheid, toerekenbaarheid, schade, causaal verband en relativiteit. Gebruik de zorgvuldigheidsnorm van Lindenbaum/Cohen. Lees de scan voor de feiten en het oordeel.'],
['Kelderluik','05-11-1965','Wk 5 · onrechtmatige daad','Verkort Verklaard, p. 47-49','Feiten: iemand viel in een openstaand kelderluik. Rechtsvraag: wanneer is het laten bestaan van een gevaarlijke situatie onrechtmatig? Beslissing: de rechter weegt gezichtspunten af: kans op schade, ernst, bezwaarlijkheid van voorzorgsmaatregelen en aard van de gedraging. Belang: standaard bij gevaarzetting.'],
['Booy/Wisman','21-01-1966','Wk 2 · wilsgebreken','Verkort Verklaard, p. 50-52','Leerstuk: wilsgebreken (zie Baris/Riezenkamp). Herken welk gebrek speelt door te kijken naar de handeling van de wederpartij: dreigt zij, misleidt zij, benut zij een omstandigheid, of dwaalt de ander zelf? Lees de scan voor het oordeel.'],
['Saladin/HBU','19-05-1967','Wk 3 · inhoud van overeenkomst','Zeug Geel-113, p. 252-254','Leerstuk: inhoud van overeenkomsten. Naast wat is afgesproken bepalen ook redelijkheid en billijkheid de inhoud (nu 6:248: aanvullen in lid 1, beperken in lid 2). Controleer in de scan hoe de HR dit voor een bank toepast.'],
['Vliegtuigvleugel','05-01-1968','Wk 4 · wanprestatie','Verkort Verklaard, p. 63-65','Leerstuk: schadevergoeding wegens tekortkoming. Toets 6:74, toerekenbaarheid (6:75), schadeposten (6:96) en toerekening van de schade (6:98). Lees de scan voor de feiten en de beslissing.'],
['Bunde/Erckens (Misverstand)','17-12-1976','Wk 1 en 3 · totstandkoming en uitleg','Verkort Verklaard, p. 88-90','Rechtsvraag: wat als partijen elkaars verklaring verschillend begrijpen? Beslissing: beslissend is wat partijen over en weer redelijkerwijs uit elkaars verklaringen en gedragingen mochten afleiden (vertrouwensleer, nu 3:35). Een verklaring bindt dus als de ander er redelijkerwijs op mocht vertrouwen. Belang: basis van de vertrouwensleer.'],
['Haviltex','13-03-1981','Wk 3 · uitleg van overeenkomst','Verkort Verklaard, p. 105-107','Rechtsvraag: hoe leg je een overeenkomst uit? Beslissing: naar de zin die partijen in de gegeven omstandigheden over en weer redelijkerwijs aan de bepalingen mochten toekennen en wat zij redelijkerwijs van elkaar mochten verwachten. De taalkundige betekenis is niet doorslaggevend. Belang: standaardmaatstaf voor uitleg.'],
['Hofland/Hennis','10-04-1981','Wk 1 · totstandkoming','Verkort Verklaard, p. 108-111','Leerstuk: totstandkoming van rechtshandelingen en overeenkomsten. Toets wil, verklaring en het vertrouwensbeginsel (3:33, 3:35) en aanbod en aanvaarding (6:217). Lees de scan voor de precieze regel.'],
['Van Geest/Nederlof','21-12-1990','Wk 2 · wilsgebreken','Zeug Geel-113, p. 160-161','Leerstuk: wilsgebreken (zie Baris/Riezenkamp). Let bij dwaling op de mededelingsplicht en de onderzoeksplicht en de afweging van gezichtspunten. Lees tot en met de tweede bullet onder Toelichting.'],
['Dépex/Curatoren van Bergel','15-11-1991','Wk 6 · introductie goederenrecht','Zeug Geel-113, p. 16-17','Leerstuk: goederenrecht: eigendom, bezit en de positie van de rechthebbende tegenover derden. Lees de scan voor de rechtsvraag en het oordeel.'],
['Campina/Van Jole','19-11-1993','Wk 3 · onvoorziene omstandigheden','Verkort Verklaard, p. 158-160','Leerstuk: onvoorziene omstandigheden (6:258). De rechter kan wijzigen of ontbinden als ongewijzigde instandhouding onaanvaardbaar is en de omstandigheden niet voor rekening van de vorderende partij komen. De rechter is hierin terughoudend.'],
['Ontvanger/Rabo (Portacabin)','31-10-1997','Wk 8 · natrekking','Zeug Geel-113, p. 21-22','Leerstuk: natrekking als originaire verkrijging. Een bestanddeel is wat volgens verkeersopvatting deel uitmaakt van een zaak (3:4); de eigenaar van de hoofdzaak wordt dan eigenaar. Lees de scan voor de uitkomst met betrekking tot de units.']];

['Wrongful birth','21-02-1997','Wk 1 · driehoekmodel','Ouders vorderen schadevergoeding voor de geboorte van een kind. In Recht in Context gebruikt om het driehoekmodel te laten zien: regels, waarden (het leven) en maatschappelijke praktijk.'],

['Refah Partisi','13-02-2003','Wk 5 · democratie','Een Turkse partij werd ontbonden omdat zij de democratie wilde aantasten. Het EHRM oordeelde dat dit toelaatbaar was: democratie mag zich beschermen. Voorbeeld van inhoudelijke of strijdbare democratie.'],
